[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp_bethington-cheat-engine-server-python"
version = "0.1.0"
description = "A Python MCP server for safe Cheat Engine functionality"
authors = [
    {name = "Anthropic", email = "support@anthropic.com"}
]
license = {text = "MIT"}
classifiers = [
    "Private :: Do Not Upload"  # Prevents accidental uploads to PyPI
]
dependencies = [
    "mcp>=1.0.0",
    "trio>=0.22.0", 
    "psutil>=5.9.0",
    "capstone>=5.0.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pywinauto>=0.6.8"
]

[tool.setuptools]
packages = ["server", "server.cheatengine", "server.config", "server.gui_automation", "server.gui_automation.core", "server.gui_automation.demos", "server.gui_automation.tools", "server.memory", "server.process", "server.pyautogui", "server.utils", "server.window_automation"]

[tool.setuptools.package-data]
server = ["**/*.json"]

[project.scripts]
iflow-mcp_bethington-cheat-engine-server-python = "server.main:main"